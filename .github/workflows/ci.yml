name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: python3
          - runner: macos-15
            python: python3
          - runner: windows-2022
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - run: go test ./...
      - name: Check concurrency on Linux
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Build native CLI without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/ ./cmd/oidc-cli
      - name: Test release archive format
        run: ${{ matrix.python }} -m unittest discover -s scripts -p 'test_*.py' -v
