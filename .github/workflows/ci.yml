name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: python3
          - runner: macos-15
            python: python3
          - runner: windows-2022
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - run: go test ./...
      - name: Check concurrency on Linux
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Build native CLI without cgo
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/ ./cmd/oidc-cli
      - name: Test release archive format
        run: ${{ matrix.python }} -m unittest discover -s scripts -p 'test_*.py' -v
