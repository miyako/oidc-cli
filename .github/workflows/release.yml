name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE:
        required: true
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      NOTARYTOOL_APPLE_ID:
        required: true
      NOTARYTOOL_TEAM_ID:
        required: true
      NOTARYTOOL_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify and publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" "${flags[@]}" ./*.tar.gz ./*.zip SHA256SUMS APPLE_NOTARIZATION.json
