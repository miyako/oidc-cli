services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: disposable-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: disposable-admin-password
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/oidc-cli-realm.json:ro
